name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CariYuk v__VERSION__"
          releaseBody: |
            Aplikasi pencarian file cepat untuk Windows dengan panel ala Spotlight.

            ## Cara Install
            1. Download file `CariYuk_x.y.z_x64-setup.exe` di bawah (Assets)
            2. Jalankan installer — tanpa perlu admin (install per-user)
            3. Tekan hotkey global untuk membuka panel pencarian

            ## Catatan
            - Jika hotkey default sudah dipakai aplikasi lain, CariYuk otomatis memilih kombinasi alternatif yang tersedia
            - App berjalan di system tray — klik kanan icon tray untuk Keluar
          releaseDraft: false
          prerelease: false
